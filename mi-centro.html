<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Tu centro de control — Club de Mentes Brillantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#b89a57; --azul-osc:#8b7440; --naranja:#c2703d; --verde:#4f8f5b;
    --hero-bg:#faf8f2; --hero-bg2:#f3efe5; --hero-sub:#5a5346; --hero-line:rgba(31,31,28,.1);
    --accent:#b89a57; --gold-light:#d0b06a;
    --gris-bg:#faf8f2; --gris-borde:#e7ddc9; --texto:#1f1f1c; --texto-suave:#6b6459;
    --font-serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --font-sans:'Source Sans 3',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
    --sombra:rgba(53,42,21,.1) 0px 10px 25px 0px;
    /* Colores DISC de Ágora (los mismos de disc-agora.html) y del FODA. */
    --d:#b8452f; --i:#c9a227; --s:#4f8f5b; --c:#3f6f94;
    --f:#4f8f5b; --o:#b89a57; --df:#c2703d; --a:#4a7a9b;
  }
  *{box-sizing:border-box;}
  body{font-family:var(--font-sans);margin:0;background:linear-gradient(180deg,var(--hero-bg) 0%,var(--hero-bg2) 100%) fixed;color:var(--texto);}
  .topbar{max-width:1080px;margin:0 auto;padding:16px 32px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .topbar .logo-link img{height:34px;width:auto;display:block;}
  .topbar a{color:var(--texto-suave);font-size:.82rem;font-weight:700;text-decoration:none;}
  .topbar a:hover{color:var(--azul-osc);}
  .topbar .enlaces{display:inline-flex;gap:18px;align-items:center;flex-wrap:wrap;}
  header{padding:34px 32px 0;border-bottom:1px solid var(--hero-line);}
  .hero-inner{max-width:1080px;margin:0 auto;padding-bottom:30px;}
  header .eyebrow{display:inline-block;font-size:.76rem;color:#fff;background:linear-gradient(135deg,var(--azul),var(--gold-light));padding:6px 16px;border-radius:999px;margin:0 0 14px;font-weight:700;box-shadow:var(--sombra);}
  header h1{font-family:var(--font-serif);margin:0 0 12px;font-size:2.4rem;line-height:1.15;font-weight:700;}
  header p{margin:0;font-size:.98rem;color:var(--hero-sub);max-width:620px;line-height:1.6;}
  main{max-width:1000px;margin:0 auto;padding:30px 20px 60px;}
  .card{background:#fff;border:1px solid var(--gris-borde);border-radius:16px;padding:24px 26px;margin-bottom:20px;box-shadow:var(--sombra);}
  .card h2{font-family:var(--font-serif);margin:0 0 8px;font-size:1.6rem;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .card h2 .n{font-family:var(--font-sans);font-size:.85rem;color:var(--texto-suave);font-weight:600;}
  .card h3{font-family:var(--font-serif);margin:16px 0 6px;font-size:1.2rem;color:var(--azul-osc);}
  .note{font-size:.82rem;color:var(--texto-suave);line-height:1.5;}
  p{line-height:1.6;}
  a{color:var(--azul-osc);}
  button.primary, a.primary{background:linear-gradient(135deg,var(--azul),var(--gold-light));color:#fff;border:none;padding:12px 28px;border-radius:999px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:var(--font-sans);box-shadow:var(--sombra);text-decoration:none;display:inline-block;}
  button.secondary, a.secondary{background:#fff;color:var(--azul-osc);border:1.5px solid var(--azul);padding:7px 16px;border-radius:999px;font-size:.84rem;font-weight:700;cursor:pointer;margin:8px 8px 0 0;font-family:var(--font-sans);text-decoration:none;display:inline-block;}
  button.secondary.peligro{color:#8a3d1c;border-color:#e0a98f;}
  button:disabled{opacity:.5;cursor:default;}

  .cifras{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  .cifra{background:#fff;border:1px solid var(--gris-borde);border-radius:14px;padding:14px 16px;box-shadow:var(--sombra);text-decoration:none;color:inherit;}
  .cifra b{display:block;font-family:var(--font-serif);font-size:2rem;line-height:1.1;color:var(--azul-osc);}
  .cifra span{font-size:.82rem;color:var(--texto-suave);font-weight:600;}

  .registro{border-top:1px solid var(--gris-borde);padding:14px 0;}
  .registro:first-of-type{border-top:none;}
  .registro .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .registro .tit{font-weight:700;}
  .registro .sub{font-size:.84rem;color:var(--texto-suave);margin-top:2px;}
  .registro .acc{display:flex;gap:0;flex-wrap:wrap;}
  .registro .acc button{margin-top:0;}
  .detalle{margin-top:12px;background:var(--gris-bg);border:1px solid var(--gris-borde);border-radius:12px;padding:14px 16px;}
  .netos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 10px;}
  .netos div{background:#fff;border:1px solid var(--gris-borde);border-top:4px solid var(--color);border-radius:10px;padding:8px 10px;font-size:.84rem;}
  .netos b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums;}
  .foda{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .foda div{background:#fff;border:1px solid var(--gris-borde);border-top:4px solid var(--color);border-radius:10px;padding:10px 12px;font-size:.88rem;}
  .foda strong{color:var(--color);display:block;margin-bottom:4px;}
  .foda ul{margin:0;padding-left:18px;line-height:1.45;}
  .vacio{font-size:.86rem;color:var(--texto-suave);font-style:italic;}
  table.evol{width:100%;border-collapse:collapse;font-size:.88rem;}
  table.evol th, table.evol td{padding:7px 8px;border-bottom:1px solid var(--gris-borde);text-align:right;font-variant-numeric:tabular-nums;}
  table.evol th:first-child, table.evol td:first-child{text-align:left;}
  .tabla-c{overflow-x:auto;}
  .item{padding:9px 0;border-top:1px solid var(--gris-borde);font-size:.92rem;}
  .item:first-of-type{border-top:none;}
  .item .sub{font-size:.82rem;color:var(--texto-suave);}
  .item.expirada{opacity:.65;}

  @media(max-width:700px){
    .topbar{padding:14px 20px 0;} header{padding:26px 20px 0;} header h1{font-size:1.85rem;}
    main{padding:22px 16px 48px;} .card{padding:18px 16px;}
    .cifras{grid-template-columns:1fr 1fr;} .netos{grid-template-columns:1fr 1fr;} .foda{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="logo-link" href="https://www.clubmentesbrillantes.com.mx/index.html" aria-label="Club de Mentes Brillantes"><img src="logo-cmb.svg" alt="Club de Mentes Brillantes"></a>
  <span class="enlaces">
    <a href="disc-agora.html">Tu Perfil DISC →</a>
    <a href="foda.html">Tu FODA →</a>
    <a href="index.html">← Volver a tu CV frente al mercado</a>
  </span>
</div>

<header>
  <div class="hero-inner">
    <span class="eyebrow">Tu cuenta</span>
    <h1>Tu centro de control</h1>
    <p id="quien">Todo lo que has guardado en tu cuenta del Club: tus perfiles DISC, tus FODA, tus análisis de CV y tus vacantes. Lo ves desde cualquier dispositivo en el que entres.</p>
  </div>
</header>

<main id="contenido">
  <div class="card"><p class="note">Cargando tu cuenta…</p></div>
</main>

<script src="disc-interpretacion.js"></script>
<script src="cuenta-registros.js"></script>
<script>
/* =====================================================================
   Centro de control — lo guardado en la cuenta
   =====================================================================
   Lee GET /cuenta del Worker de cuentas (la misma sesión de index.html) y
   pinta: perfiles DISC y FODA guardados con "Guardar en mi cuenta"
   (cuenta-registros.js), análisis de CV y vacantes. Solo lee y borra; para
   agregar, la persona usa cada herramienta.

   Todo lo que viene de la cuenta pasa por esc(): el token vive en
   localStorage y un texto con etiquetas sería una forma de robarlo.
   ===================================================================== */
const esc = REGISTROS.esc;
const fecha = v => v ? DISC.fechaLegible(String(v)) : 'fecha no registrada';
const renglones = t => String(t || '').split('\n').map(s => s.trim()).filter(Boolean);
let CUENTA = null;
const abiertos = new Set();
let porBorrar = null;

function sinSesion(msg){
  document.getElementById('contenido').innerHTML =
    '<div class="card"><h2>Entra a tu cuenta</h2>' +
    '<p>' + esc(msg || 'Para ver tu centro de control necesitas entrar a tu cuenta del Club. Entras con un código que llega a tu correo; no hay contraseñas.') + '</p>' +
    '<a class="primary" href="index.html?entrar=1">Entrar o crear mi cuenta</a>' +
    '<p class="note">Lo que hiciste sin cuenta (tu DISC o tu FODA) sigue guardado en el dispositivo donde lo hiciste. Cuando entres, ábrelo ahí y toca «Guardar en mi cuenta».</p></div>';
}

async function cargar(){
  if(!REGISTROS.sesion()){ sinSesion(); return; }
  try{
    CUENTA = await REGISTROS.api('/cuenta');
    pintar();
  }catch(err){
    if(err.sesion) sinSesion('Tu sesión venció. Vuelve a entrar para ver tu centro de control.');
    else document.getElementById('contenido').innerHTML = '<div class="card"><h2>No pudimos leer tu cuenta</h2><p>Revisa tu conexión e intenta otra vez en unos minutos.</p><button class="secondary" type="button" onclick="cargar()">Reintentar</button></div>';
  }
}

/* ---------------- DISC ---------------- */
function escalaDe(d){
  if(d.escala && typeof d.escala.min === 'number') return d.escala;
  return d.instrumento === 'bloques' ? {min:-48, max:48} : {min:0, max:82};
}
function detalleDisc(r){
  const d = r.datos || {}, p = d.puntajes;
  if(!p || !p.D) return '<p class="vacio">Este registro no trae puntajes.</p>';
  const esc2 = escalaDe(d);
  const {dom, plano} = DISC.analizar(p, esc2);
  const a = DISC.AGORA[dom] || {};
  return '<div class="netos">' + DISC.CLAVES.map(k =>
      '<div style="--color:' + DISC.FACTORES[k].color + '"><span>' + esc(DISC.FACTORES[k].nombre) + '</span><b>' + esc(p[k].neto) + '</b></div>').join('') + '</div>' +
    DISC.tablero(p, esc2) +
    (plano ? '<p>Tus cuatro factores salieron muy parejos en esta vez.</p>'
      : '<p><strong style="color:' + DISC.FACTORES[dom].color + '">' + esc(DISC.FACTORES[dom].nombre) + ':</strong> ' + esc(DISC.FACTORES[dom].resumen) + '</p>' +
        (a.descripcion && a.descripcion.length ? '<p class="note">' + esc(a.descripcion[0]) + '</p>' : '')) +
    '<p class="note">Para la interpretación completa, vuelve a contestar el <a href="disc-agora.html">Perfil DISC</a>: cada vez que lo guardes, queda como un registro nuevo y puedes comparar.</p>';
}
function evolucionDisc(discs){
  const ag = discs.filter(r => r.datos && r.datos.puntajes && r.datos.instrumento !== 'bloques');
  if(ag.length < 2) return '';
  const filas = ag.slice().reverse();   // de la más vieja a la más nueva
  return '<h3>Cómo ha cambiado tu perfil</h3><div class="tabla-c"><table class="evol"><thead><tr><th>Fecha</th>' +
    DISC.CLAVES.map(k => '<th style="color:' + DISC.FACTORES[k].color + '">' + esc(DISC.FACTORES[k].nombre) + '</th>').join('') + '<th>Dominante</th></tr></thead><tbody>' +
    filas.map(r => { const p = r.datos.puntajes, an = DISC.analizar(p, escalaDe(r.datos));
      return '<tr><td>' + esc(fecha(r.fecha)) + '</td>' + DISC.CLAVES.map(k => '<td>' + esc(p[k].neto) + '</td>').join('') +
        '<td>' + esc(an.plano ? 'Parejo' : DISC.FACTORES[an.dom].nombre) + '</td></tr>'; }).join('') +
    '</tbody></table></div><p class="note">Solo el cuestionario de Ágora (0 a 82 por color). Un cambio de pocos puntos es normal; fíjate en si cambia el orden de los colores.</p>';
}

/* ---------------- FODA ---------------- */
function detalleFoda(r){
  const d = r.datos || {};
  const q = (k, nombre, color) => {
    const xs = renglones(d[k]);
    return '<div style="--color:var(' + color + ')"><strong>' + nombre + '</strong>' +
      (xs.length ? '<ul>' + xs.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '<span class="vacio">Sin ideas</span>') + '</div>';
  };
  return '<div class="foda">' + q('F', 'Fortalezas', '--f') + q('D', 'Debilidades', '--df') + q('O', 'Oportunidades', '--o') + q('A', 'Amenazas', '--a') + '</div>' +
    (renglones(d.paso).length ? '<p><strong>Siguiente paso:</strong> ' + esc(renglones(d.paso).join(' ')) + '</p>' : '') +
    '<p class="note">Para cambiarlo, ábrelo en <a href="foda.html">Tu FODA</a> en el dispositivo donde lo hiciste y toca «Actualizar en mi cuenta».</p>';
}

/* ---------------- lista de registros ---------------- */
function registro(r, detalle){
  const abierto = abiertos.has(r.id), borrar = porBorrar === r.id;
  const act = r.actualizado && String(r.actualizado).slice(0, 10) !== String(r.fecha).slice(0, 10) ? ' · actualizado el ' + fecha(r.actualizado) : '';
  return '<div class="registro" data-id="' + esc(r.id) + '"><div class="cab"><div><div class="tit">' + esc(r.titulo || (r.tipo === 'disc' ? 'Perfil DISC' : 'Análisis FODA')) + '</div>' +
    '<div class="sub">' + esc(fecha(r.fecha)) + esc(act) + (r.resumen ? ' · ' + esc(r.resumen) : '') + '</div></div>' +
    '<div class="acc"><button class="secondary" type="button" data-ver="' + esc(r.id) + '" aria-expanded="' + abierto + '">' + (abierto ? 'Ocultar' : 'Ver') + '</button>' +
    '<button class="secondary peligro" type="button" data-borrar="' + esc(r.id) + '">' + (borrar ? 'Confirmar: borrar' : 'Borrar') + '</button></div></div>' +
    (abierto ? '<div class="detalle">' + detalle(r) + '</div>' : '') + '</div>';
}

function pintar(){
  const c = CUENTA || {}, u = c.usuario || (REGISTROS.sesion() || {}).usuario || {};
  const regs = c.registros || [];
  const discs = regs.filter(r => r.tipo === 'disc'), fodas = regs.filter(r => r.tipo === 'foda');
  const hist = (c.historial || []).slice().reverse(), vac = (c.vacantes || []).slice().reverse();
  document.getElementById('quien').textContent = (u.nombre ? u.nombre + ', aquí' : 'Aquí') + ' está todo lo que has guardado en tu cuenta' + (u.correo ? ' (' + u.correo + ')' : '') + '. Lo ves desde cualquier dispositivo en el que entres.';
  const cifra = (n, t, ancla) => '<a class="cifra" href="#' + ancla + '"><b>' + n + '</b><span>' + t + '</span></a>';
  document.getElementById('contenido').innerHTML =
    '<div class="cifras">' + cifra(discs.length, 'Perfiles DISC', 'disc') + cifra(fodas.length, 'Análisis FODA', 'foda') + cifra(hist.length, 'Análisis de CV', 'cv') + cifra(vac.length, 'Vacantes guardadas', 'vacantes') + '</div>' +
    '<div class="card" id="disc"><h2>Mis perfiles DISC <span class="n">' + discs.length + '</span></h2>' +
      (discs.length ? discs.map(r => registro(r, detalleDisc)).join('') + evolucionDisc(discs)
        : '<p class="vacio">Todavía no has guardado un Perfil DISC.</p><a class="secondary" href="disc-agora.html">Hacer mi Perfil DISC</a>') + '</div>' +
    '<div class="card" id="foda"><h2>Mis FODA <span class="n">' + fodas.length + '</span></h2>' +
      (fodas.length ? fodas.map(r => registro(r, detalleFoda)).join('')
        : '<p class="vacio">Todavía no has guardado un FODA.</p><a class="secondary" href="foda.html">Hacer mi FODA</a>') + '</div>' +
    '<div class="card" id="cv"><h2>Mis análisis de CV <span class="n">' + hist.length + '</span></h2>' +
      (hist.length ? hist.map(h => '<div class="item"><strong>' + esc(h.sector || 'Sector no registrado') + '</strong><div class="sub">' + esc(fecha(h.fecha)) +
        (h.cobertura !== '' && h.cobertura != null ? ' · ' + esc(h.cobertura) + '% de cobertura' : ' · cobertura: dato pendiente') + '</div></div>').join('')
        : '<p class="vacio">Todavía no has guardado un análisis de CV.</p><a class="secondary" href="index.html">Analizar mi CV</a>') + '</div>' +
    '<div class="card" id="vacantes"><h2>Mis vacantes guardadas <span class="n">' + vac.length + '</span></h2>' +
      (vac.length ? vac.map(v => '<div class="item' + (v.vigente === false ? ' expirada' : '') + '">' +
        (v.url ? '<a href="' + esc(v.url) + '" target="_blank" rel="noopener noreferrer"><strong>' + esc(v.titulo || 'Vacante') + '</strong></a>' : '<strong>' + esc(v.titulo || 'Vacante') + '</strong>') +
        '<div class="sub">' + esc([v.empresa, v.ubicacion].filter(Boolean).join(' · ')) + (v.vigente === false ? ' — ya no aparece en la corrida más reciente' : '') + '</div></div>').join('')
        : '<p class="vacio">Todavía no has guardado vacantes.</p>') + '</div>' +
    '<p class="note">Lo guardado aquí vive en la hoja de cuentas del Club, ligado a tu correo. Solo tú lo ves en esta página; no se comparte con empresas. ' +
      'Puedes borrar cada registro aquí mismo. Para borrar tu cuenta completa escribe a <a href="mailto:clubmentesbrillantesla@gmail.com">clubmentesbrillantesla@gmail.com</a>. ' +
      'Más detalle en el <a href="aviso-privacidad.html">Aviso de Privacidad</a>.</p>';
}

document.addEventListener('click', async e => {
  const ver = e.target.closest('[data-ver]'), bor = e.target.closest('[data-borrar]');
  if(ver){ const id = ver.dataset.ver; abiertos.has(id) ? abiertos.delete(id) : abiertos.add(id); porBorrar = null; pintar(); }
  else if(bor){
    const id = bor.dataset.borrar;
    if(porBorrar !== id){ porBorrar = id; pintar(); return; }   // dos toques, sin diálogo del navegador
    bor.disabled = true; bor.textContent = 'Borrando…';
    try{
      await REGISTROS.api('/cuenta/registro/borrar', {id});
      CUENTA.registros = (CUENTA.registros || []).filter(r => r.id !== id);
      try{ const g = JSON.parse(localStorage.getItem('cmb_registros_guardados') || '{}'); delete g[id]; localStorage.setItem('cmb_registros_guardados', JSON.stringify(g)); }catch(err){}
      porBorrar = null; pintar();
    }catch(err){
      if(err.sesion){ sinSesion('Tu sesión venció. Vuelve a entrar.'); return; }
      bor.disabled = false; bor.textContent = 'No se pudo; intenta otra vez';
    }
  }
});

cargar();
</script>
</body>
</html>
